providers = ['python', 'node']

[phases.setup]
nixPkgs = ['...']

[phases.install]
cmds = [
  "cd frontend && npm install",
  "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "cd backend && flask db upgrade && gunicorn app:app"
